<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>缓冲明细</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:#f0f2f5; color:#333; min-width:1280px;
    }
    /* ── 顶栏 ── */
    .topbar {
      background:#fff; border-bottom:1px solid #e8e8e8;
      padding:0 24px; height:56px; display:flex; align-items:center;
      justify-content:space-between; position:sticky; top:0; z-index:100;
      box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .tl { display:flex; align-items:center; gap:16px; }
    .logo { font-size:18px; font-weight:700; color:#1890ff; letter-spacing:1px; }
    .vd  { width:1px; height:20px; background:#e8e8e8; }
    .bc  { font-size:13px; color:#8c8c8c; display:flex; align-items:center; gap:6px; }
    .bc a { color:#595959; text-decoration:none; } .bc a:hover { color:#1890ff; }
    .bc-sep { color:#bfbfbf; }
    .bc-cur { color:#262626; font-weight:500; }
    .tr { display:flex; align-items:center; gap:16px; font-size:13px; color:#595959; }
    .av { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }

    .main { padding:24px; }

    /* ── 按钮 ── */
    .btn { display:inline-flex; align-items:center; justify-content:center; height:32px; padding:0 16px; border-radius:4px; font-size:13px; font-weight:500; cursor:pointer; border:1px solid transparent; transition:all .2s; gap:5px; white-space:nowrap; }
    .btn-primary { background:#1890ff; color:#fff; border-color:#1890ff; }
    .btn-primary:hover { background:#40a9ff; border-color:#40a9ff; }
    .btn-default { background:#fff; color:#595959; border-color:#d9d9d9; }
    .btn-default:hover { color:#1890ff; border-color:#1890ff; }
    .btn-warn { background:#fa8c16; color:#fff; border-color:#fa8c16; }
    .btn-warn:hover { background:#ffa940; border-color:#ffa940; }
    .btn-sm { height:26px; padding:0 10px; font-size:12px; }
    .btn-link { background:none; border:none; color:#1890ff; padding:0 4px; height:auto; font-size:13px; cursor:pointer; }
    .btn-link:hover { color:#40a9ff; }
    .btn-link.danger { color:#f5222d; } .btn-link.danger:hover { color:#ff7875; }

    /* ── 统计卡 ── */
    .stat-row { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:16px; }
    .stat-card { background:#fff; border-radius:8px; padding:16px 20px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; align-items:center; gap:14px; cursor:pointer; transition:box-shadow .2s; border:2px solid transparent; }
    .stat-card:hover { box-shadow:0 3px 10px rgba(0,0,0,.1); }
    .stat-card.active { border-color:#1890ff; }
    .si { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .si-gray   { background:#f5f5f5; }
    .si-orange { background:#fff7e6; }
    .si-blue   { background:#e6f7ff; }
    .si-green  { background:#f6ffed; }
    .si-red    { background:#fff2f0; }
    .sb-lbl { font-size:12px; color:#8c8c8c; margin-bottom:4px; }
    .sb-val { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
    .c-gray   { color:#595959; }
    .c-orange { color:#fa8c16; }
    .c-blue   { color:#1890ff; }
    .c-green  { color:#52c41a; }
    .c-red    { color:#f5222d; }

    /* ── 筛选 ── */
    .filter-card { background:#fff; border-radius:8px; padding:18px 24px 12px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .filter-row  { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end; }
    .fi { display:flex; flex-direction:column; gap:5px; }
    .fl { font-size:13px; color:#595959; font-weight:500; }
    .inp,.sel { height:32px; border:1px solid #d9d9d9; border-radius:4px; padding:0 11px; font-size:13px; color:#333; background:#fff; outline:none; transition:border-color .2s; min-width:155px; }
    .inp:focus,.sel:focus { border-color:#1890ff; box-shadow:0 0 0 2px rgba(24,144,255,.12); }
    .inp::placeholder { color:#bfbfbf; }
    .fa { display:flex; gap:8px; align-items:flex-end; margin-left:auto; }

    /* ── 表格 ── */
    .table-card { background:#fff; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden; }
    .tbl-tb { padding:12px 24px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; justify-content:space-between; }
    .tbl-sum { font-size:13px; color:#595959; } .tbl-sum strong { color:#262626; }

    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead th { background:#fafafa; color:#595959; font-weight:600; padding:11px 14px; text-align:left; border-bottom:1px solid #f0f0f0; white-space:nowrap; }
    tbody tr { border-bottom:1px solid #f5f5f5; transition:background .15s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:#f5f9ff; }
    tbody td { padding:10px 14px; color:#262626; vertical-align:middle; }
    .td-mono { font-family:monospace; font-size:12px; color:#595959; }
    .td-seq  { color:#8c8c8c; font-size:12px; }
    .td-r    { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
    .td-r.dr { color:#f5222d; }
    .td-r.cr { color:#1890ff; }

    /* ── 徽章 ── */
    .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:10px; font-size:12px; font-weight:500; }
    .badge::before { content:""; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .b-wait  { background:#fff7e6; color:#fa8c16; border:1px solid #ffd591; }  .b-wait::before  { background:#fa8c16; animation:blink 1.4s infinite; }
    .b-proc  { background:#e6f7ff; color:#1890ff; border:1px solid #91d5ff; }  .b-proc::before  { background:#1890ff; animation:blink 1.2s infinite; }
    .b-done  { background:#f6ffed; color:#52c41a; border:1px solid #b7eb8f; }  .b-done::before  { background:#52c41a; }
    .b-fail  { background:#fff2f0; color:#f5222d; border:1px solid #ffccc7; }  .b-fail::before  { background:#f5222d; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

    .tag { display:inline-block; padding:2px 9px; border-radius:4px; font-size:12px; border:1px solid; }
    .t-blue   { background:#e6f7ff; color:#1890ff; border-color:#91d5ff; }
    .t-teal   { background:#e6fffb; color:#08979c; border-color:#87e8de; }
    .t-purple { background:#f9f0ff; color:#722ed1; border-color:#d3adf7; }

    .dir-dr { color:#f5222d; font-weight:700; }
    .dir-cr { color:#1890ff; font-weight:700; }
    .retry-badge { background:#fff0f6; color:#c41d7f; border:1px solid #ffadd2; border-radius:10px; padding:1px 8px; font-size:12px; }

    /* ── 分页 ── */
    .pg-wrap { padding:14px 24px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid #f0f0f0; }
    .pg-info { font-size:13px; color:#8c8c8c; }
    .pg { display:flex; align-items:center; gap:6px; }
    .pgb { min-width:32px; height:32px; border:1px solid #d9d9d9; border-radius:4px; background:#fff; color:#595959; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 8px; transition:all .2s; }
    .pgb:hover { color:#1890ff; border-color:#1890ff; }
    .pgb.act  { color:#fff; background:#1890ff; border-color:#1890ff; }
    .pgb:disabled { color:#bfbfbf; cursor:not-allowed; border-color:#e8e8e8; }
    .pgsz { height:32px; border:1px solid #d9d9d9; border-radius:4px; padding:0 8px; font-size:13px; background:#fff; cursor:pointer; }

    /* ── 弹窗 ── */
    .modal-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; align-items:center; justify-content:center; }
    .modal-ov.show { display:flex; }
    .modal { background:#fff; border-radius:8px; box-shadow:0 6px 40px rgba(0,0,0,.18); width:660px; max-width:95vw; max-height:90vh; overflow-y:auto; }
    .mh { padding:18px 24px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; justify-content:space-between; }
    .mt { font-size:16px; font-weight:600; color:#262626; }
    .mx { font-size:18px; color:#8c8c8c; cursor:pointer; background:none; border:none; }
    .mx:hover { color:#262626; }
    .mb { padding:24px; }
    .mf { padding:14px 24px; border-top:1px solid #f0f0f0; display:flex; justify-content:flex-end; gap:10px; }

    .dg { display:grid; grid-template-columns:1fr 1fr; gap:14px 30px; }
    .dg-full { grid-column:1/-1; }
    .dl { font-size:12px; color:#8c8c8c; margin-bottom:3px; }
    .dv { font-size:14px; color:#262626; font-weight:500; }
    .ddiv { grid-column:1/-1; border:none; border-top:1px dashed #f0f0f0; margin:2px 0; }
    .dsec { grid-column:1/-1; font-size:13px; font-weight:600; color:#595959; border-left:3px solid #1890ff; padding-left:8px; margin-top:4px; }

    .fail-box { background:#fff2f0; border:1px solid #ffccc7; border-radius:6px; padding:12px 14px; margin-bottom:16px; }
    .fail-box-title { font-size:13px; font-weight:600; color:#f5222d; margin-bottom:6px; }
    .fail-box-msg   { font-size:13px; color:#595959; font-family:monospace; }

    /* ── Toast ── */
    #toast { position:fixed; bottom:32px; right:32px; z-index:9999; background:#262626; color:#fff; padding:10px 20px; border-radius:6px; font-size:13px; box-shadow:0 4px 12px rgba(0,0,0,.3); transition:opacity .3s; opacity:0; pointer-events:none; }
  </style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="tl">
    <div class="logo">账务核心</div>
    <div class="vd"></div>
    <div class="bc">
      <a href="index.html">首页</a>
      <span class="bc-sep">›</span>
      <span class="bc-cur">缓冲明细</span>
    </div>
  </div>
  <div class="tr">
    <span>会计日期：2025-03-13</span>
    <div class="vd"></div>
    <div class="av">管理</div>
  </div>
</div>

<div class="main">

  <!-- 统计卡（可点击筛选） -->
  <div class="stat-row">
    <div class="stat-card active" id="sc-all"  onclick="filterByStatus('')">
      <div class="si si-gray">📋</div>
      <div><div class="sb-lbl">全部明细</div><div class="sb-val c-gray"   id="cnt-all">0</div></div>
    </div>
    <div class="stat-card" id="sc-wait" onclick="filterByStatus('WAIT')">
      <div class="si si-orange">⏳</div>
      <div><div class="sb-lbl">待记账</div><div class="sb-val c-orange" id="cnt-wait">0</div></div>
    </div>
    <div class="stat-card" id="sc-proc" onclick="filterByStatus('PROCESSING')">
      <div class="si si-blue">⚙️</div>
      <div><div class="sb-lbl">记账中</div><div class="sb-val c-blue"   id="cnt-proc">0</div></div>
    </div>
    <div class="stat-card" id="sc-done" onclick="filterByStatus('DONE')">
      <div class="si si-green">✅</div>
      <div><div class="sb-lbl">已记账</div><div class="sb-val c-green"  id="cnt-done">0</div></div>
    </div>
    <div class="stat-card" id="sc-fail" onclick="filterByStatus('FAIL')">
      <div class="si si-red">❌</div>
      <div><div class="sb-lbl">记账失败</div><div class="sb-val c-red"  id="cnt-fail">0</div></div>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="filter-card">
    <div class="filter-row">
      <div class="fi">
        <label class="fl">会计日期</label>
        <input class="inp" id="f-from" type="date" value="2025-03-13"/>
      </div>
      <div class="fi">
        <label class="fl" style="opacity:0">至</label>
        <input class="inp" id="f-to" type="date" value="2025-03-13"/>
      </div>
      <div class="fi">
        <label class="fl">账户编号</label>
        <input class="inp" id="f-acct" type="text" placeholder="请输入账户编号"/>
      </div>
      <div class="fi">
        <label class="fl">缓冲模式</label>
        <select class="sel" id="f-mode">
          <option value="">全部</option>
          <option value="SINGLE">逐条缓冲</option>
          <option value="INTRADAY">日间批量汇总</option>
          <option value="EOD">日终批量汇总</option>
        </select>
      </div>
      <div class="fi">
        <label class="fl">记账状态</label>
        <select class="sel" id="f-status">
          <option value="">全部</option>
          <option value="WAIT">待记账</option>
          <option value="PROCESSING">记账中</option>
          <option value="DONE">已记账</option>
          <option value="FAIL">记账失败</option>
        </select>
      </div>
      <div class="fi">
        <label class="fl">规则编号</label>
        <input class="inp" id="f-rule" type="text" placeholder="规则编号" style="min-width:130px;"/>
      </div>
      <div class="fa">
        <button class="btn btn-primary" onclick="doSearch()">🔍 搜索</button>
        <button class="btn btn-default" onclick="doReset()">重置</button>
      </div>
    </div>
  </div>

  <!-- 表格 -->
  <div class="table-card">
    <div class="tbl-tb">
      <div class="tbl-sum">共 <strong id="total-cnt">0</strong> 条缓冲明细</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-warn btn-sm" onclick="retryFailed()">🔁 重试所有失败</button>
        <button class="btn btn-default btn-sm" onclick="toast('正在导出，请稍候…')">📥 导出</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:46px;">序号</th>
          <th style="width:190px;">缓冲明细编号</th>
          <th style="width:170px;">账户编号</th>
          <th style="width:100px;">科目编号</th>
          <th style="width:55px;">借贷</th>
          <th style="width:120px;">金额（元）</th>
          <th style="width:115px;">缓冲模式</th>
          <th style="width:130px;">关联规则</th>
          <th style="width:100px;">会计日期</th>
          <th style="width:95px;">状态</th>
          <th style="width:70px;">重试次数</th>
          <th style="width:165px;">创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pg-wrap">
      <div class="pg-info">
        每页
        <select class="pgsz" onchange="changePS(this.value)">
          <option value="10" selected>10</option>
          <option value="20">20</option>
        </select>
        条，<span id="pg-txt">共 0 条，第 1/1 页</span>
      </div>
      <div class="pg" id="pg"></div>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-ov" id="detail-modal">
  <div class="modal">
    <div class="mh">
      <div class="mt">缓冲明细详情</div>
      <button class="mx" onclick="closeModal()">✕</button>
    </div>
    <div class="mb">
      <div id="d-fail-box" class="fail-box" style="display:none;">
        <div class="fail-box-title">⚠ 记账失败原因</div>
        <div class="fail-box-msg" id="d-fail-msg"></div>
      </div>
      <div class="dg">
        <div class="dsec">明细标识</div>
        <div class="dg-full"><div class="dl">缓冲明细编号</div><div class="dv td-mono" id="d-no"></div></div>
        <div><div class="dl">记账状态</div><div class="dv" id="d-status"></div></div>
        <div><div class="dl">缓冲模式</div><div class="dv" id="d-mode"></div></div>
        <div><div class="dl">关联规则编号</div><div class="dv td-mono" id="d-rule"></div></div>
        <div><div class="dl">重试次数 / 最大次数</div><div class="dv" id="d-retry"></div></div>
        <hr class="ddiv"/>
        <div class="dsec">账务信息</div>
        <div><div class="dl">账户编号</div><div class="dv td-mono" id="d-acct"></div></div>
        <div><div class="dl">科目编号</div><div class="dv td-mono" id="d-subj"></div></div>
        <div><div class="dl">借贷方向</div><div class="dv" id="d-dir"></div></div>
        <div><div class="dl">金额（元）</div><div class="dv" id="d-amt"></div></div>
        <hr class="ddiv"/>
        <div class="dsec">时间信息</div>
        <div><div class="dl">预期会计日期</div><div class="dv" id="d-exp-date"></div></div>
        <div><div class="dl">实际会计日期</div><div class="dv" id="d-act-date"></div></div>
        <div><div class="dl">创建时间</div><div class="dv" id="d-created"></div></div>
        <div><div class="dl">记账完成时间</div><div class="dv" id="d-posted"></div></div>
        <hr class="ddiv"/>
        <div class="dsec">业务来源</div>
        <div class="dg-full"><div class="dl">外部业务单号</div><div class="dv td-mono" id="d-bizno"></div></div>
        <div class="dg-full"><div class="dl">业务摘要</div><div class="dv" id="d-summary"></div></div>
      </div>
    </div>
    <div class="mf" id="d-mf">
      <button class="btn btn-default" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const MODES      = { SINGLE:'逐条缓冲', INTRADAY:'日间批量汇总', EOD:'日终批量汇总' };
const STATUS_LBL = { WAIT:'待记账', PROCESSING:'记账中', DONE:'已记账', FAIL:'记账失败' };
const STATUS_CLS = { WAIT:'b-wait', PROCESSING:'b-proc', DONE:'b-done', FAIL:'b-fail' };

const ACCNTS  = ['13010125012410001','13010225012410001','11320125012410001','13010135012410001','13010145012410001'];
const SUBJS   = ['130101','130102','113201','201101','220101'];
const RULES   = ['BUF-RULE-001','BUF-RULE-002','BUF-RULE-003'];
const SUMS    = ['还款入账-缓冲记账','贷款发放-日间批量缓冲','应收利息归集','逾期余额转移','日终批量汇总缓冲-利息计提','还款手续费结算','资金归集汇总','逾期罚息计提'];
const FAILS   = [
  '乐观锁更新失败，升级悲观锁后仍超时（lock wait timeout）',
  '账户余额不足，借方金额超出可用余额',
  '账务日期已关闭，无法在历史日期记账',
  '规则版本不匹配，规则已被更新或停用',
];

function rnd(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function pad2(n)  { return String(n).padStart(2,'0'); }
function ts(h,m)  { return `2025-03-13 ${pad2(h)}:${pad2(m)}:${pad2(Math.floor(Math.random()*60))}`; }

const rawData = [];
const seed = [
  ...Array.from({length:8}, (_,i) => ({ s:'DONE',       mode:'SINGLE',   h:8,    m:i*5+1,   retry:0, fi:null   })),
  ...Array.from({length:6}, (_,i) => ({ s:'DONE',       mode:'INTRADAY', h:10,   m:i*8+2,   retry:0, fi:null   })),
  ...Array.from({length:5}, (_,i) => ({ s:'WAIT',       mode:'INTRADAY', h:14,   m:i*7+3,   retry:0, fi:null   })),
  ...Array.from({length:4}, (_,i) => ({ s:'WAIT',       mode:'EOD',      h:15,   m:i*10+5,  retry:0, fi:null   })),
  ...Array.from({length:3}, (_,i) => ({ s:'PROCESSING', mode:'INTRADAY', h:15,   m:30+i*3,  retry:0, fi:null   })),
  ...Array.from({length:4}, (_,i) => ({ s:'FAIL',       mode:rnd(['SINGLE','INTRADAY']), h:12+i, m:15+i*8, retry:i+1, fi:FAILS[i] })),
];

seed.forEach((s, i) => {
  const created = ts(s.h, s.m);
  rawData.push({
    id: i+1,
    no: `BUF-20250313-${String(i+1).padStart(4,'0')}`,
    status: s.s, mode: s.mode,
    rule: rnd(RULES),
    acct: ACCNTS[i%5], subj: SUBJS[i%5],
    dir:  i%2 ? 'DR' : 'CR',
    amt:  parseFloat((Math.random()*15000+200).toFixed(2)),
    retry: s.retry, maxRetry: 3,
    expDate: '2025-03-13',
    actDate: s.s==='DONE' ? '2025-03-13' : '',
    created,
    posted: s.s==='DONE' ? ts(s.h, s.m+2) : '',
    bizNo: `BIZ${created.replace(/[-: ]/g,'').slice(0,14)}${String(i+1).padStart(4,'0')}`,
    summary: rnd(SUMS),
    failMsg: s.fi || '',
  });
});

function updateStatCards() {
  document.getElementById('cnt-all').textContent  = rawData.length;
  document.getElementById('cnt-wait').textContent = rawData.filter(r=>r.status==='WAIT').length;
  document.getElementById('cnt-proc').textContent = rawData.filter(r=>r.status==='PROCESSING').length;
  document.getElementById('cnt-done').textContent = rawData.filter(r=>r.status==='DONE').length;
  document.getElementById('cnt-fail').textContent = rawData.filter(r=>r.status==='FAIL').length;
}
updateStatCards();

let fd=[...rawData], quickStatus='', cp=1, ps=10;

function filterByStatus(s) {
  quickStatus = s;
  const map = { 'all':'', 'wait':'WAIT', 'proc':'PROCESSING', 'done':'DONE', 'fail':'FAIL' };
  Object.entries(map).forEach(([k,v]) =>
    document.getElementById(`sc-${k}`).classList.toggle('active', v===s));
  applyFilters(); cp=1; render();
}

function applyFilters() {
  const acct   = document.getElementById('f-acct').value.trim();
  const mode   = document.getElementById('f-mode').value;
  const status = document.getElementById('f-status').value || quickStatus;
  const rule   = document.getElementById('f-rule').value.trim();
  const from   = document.getElementById('f-from').value;
  const to     = document.getElementById('f-to').value;
  fd = rawData.filter(r => {
    if (acct   && !r.acct.includes(acct))  return false;
    if (mode   && r.mode !== mode)          return false;
    if (status && r.status !== status)      return false;
    if (rule   && !r.rule.includes(rule))   return false;
    if (from   && r.expDate < from)         return false;
    if (to     && r.expDate > to)           return false;
    return true;
  });
}

function render() {
  const start = (cp-1)*ps;
  const rows  = fd.slice(start, start+ps);
  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="13" style="text-align:center;padding:48px;color:#8c8c8c;">暂无缓冲明细</td></tr>`;
    renderPg(); return;
  }
  tbody.innerHTML = rows.map((r,i) => {
    const dirHtml = r.dir==='DR'
      ? `<span class="dir-dr">借</span>` : `<span class="dir-cr">贷</span>`;
    const modeTag = r.mode==='SINGLE'
      ? `<span class="tag t-blue">逐条</span>`
      : r.mode==='INTRADAY'
        ? `<span class="tag t-teal">日间批量</span>`
        : `<span class="tag t-purple">日终批量</span>`;
    const retryHtml = r.retry > 0
      ? `<span class="retry-badge">${r.retry}/${r.maxRetry}</span>`
      : `<span style="color:#bfbfbf;font-size:12px;">—</span>`;
    const ops = r.status==='FAIL'
      ? `<button class="btn btn-link" onclick="openDetail(${r.id})">详情</button><span style="color:#d9d9d9;">|</span><button class="btn btn-link danger" onclick="retryOne(${r.id})">重试</button>`
      : `<button class="btn btn-link" onclick="openDetail(${r.id})">详情</button>`;
    return `<tr>
      <td class="td-seq">${start+i+1}</td>
      <td class="td-mono" style="font-size:11px;">${r.no}</td>
      <td class="td-mono">${r.acct}</td>
      <td class="td-mono">${r.subj}</td>
      <td style="text-align:center;">${dirHtml}</td>
      <td class="td-r ${r.dir==='DR'?'dr':'cr'}">${fmt(r.amt)}</td>
      <td>${modeTag}</td>
      <td class="td-mono" style="font-size:11px;">${r.rule}</td>
      <td style="color:#595959;font-size:12px;">${r.expDate}</td>
      <td><span class="badge ${STATUS_CLS[r.status]||'b-wait'}">${STATUS_LBL[r.status]||r.status}</span></td>
      <td style="text-align:center;">${retryHtml}</td>
      <td style="color:#595959;font-size:12px;">${r.created}</td>
      <td>${ops}</td>
    </tr>`;
  }).join('');
  document.getElementById('total-cnt').textContent = fd.length;
  renderPg();
}

function fmt(n) { return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }

function renderPg() {
  const total=fd.length, tp=Math.max(1,Math.ceil(total/ps));
  document.getElementById('pg-txt').textContent=`共 ${total} 条，第 ${cp}/${tp} 页`;
  const el=document.getElementById('pg'); let h='';
  h+=`<button class="pgb" ${cp<=1?'disabled':''} onclick="go(1)">«</button>`;
  h+=`<button class="pgb" ${cp<=1?'disabled':''} onclick="go(${cp-1})">‹</button>`;
  const r=[];
  for(let p=Math.max(1,cp-2);p<=Math.min(tp,cp+2);p++) r.push(p);
  if(r[0]>1) h+=`<button class="pgb" onclick="go(1)">1</button>${r[0]>2?'<span style="padding:0 4px;color:#8c8c8c;">…</span>':''}`;
  r.forEach(p=>{ h+=`<button class="pgb${p===cp?' act':''}" onclick="go(${p})">${p}</button>`; });
  if(r[r.length-1]<tp) h+=`${r[r.length-1]<tp-1?'<span style="padding:0 4px;color:#8c8c8c;">…</span>':''}<button class="pgb" onclick="go(${tp})">${tp}</button>`;
  h+=`<button class="pgb" ${cp>=tp?'disabled':''} onclick="go(${cp+1})">›</button>`;
  h+=`<button class="pgb" ${cp>=tp?'disabled':''} onclick="go(${tp})">»</button>`;
  el.innerHTML=h;
}

function go(p){cp=p;render();}
function changePS(s){ps=parseInt(s);cp=1;render();}

function doSearch() { quickStatus=''; applyFilters(); cp=1; render(); toast(`找到 ${fd.length} 条明细`); }
function doReset()  {
  ['f-acct','f-rule'].forEach(id=>document.getElementById(id).value='');
  ['f-mode','f-status'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-from').value='2025-03-13';
  document.getElementById('f-to').value='2025-03-13';
  quickStatus='';
  document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('sc-all').classList.add('active');
  fd=[...rawData]; cp=1; render(); toast('已重置筛选条件');
}

function openDetail(id) {
  const r = rawData.find(x=>x.id===id); if(!r) return;
  const fb = document.getElementById('d-fail-box');
  if (r.status==='FAIL' && r.failMsg) {
    fb.style.display=''; document.getElementById('d-fail-msg').textContent=r.failMsg;
  } else { fb.style.display='none'; }

  document.getElementById('d-no').textContent     = r.no;
  document.getElementById('d-status').innerHTML   = `<span class="badge ${STATUS_CLS[r.status]||''}">${STATUS_LBL[r.status]||r.status}</span>`;
  document.getElementById('d-mode').innerHTML     = r.mode==='SINGLE'
    ? `<span class="tag t-blue">逐条缓冲</span>`
    : r.mode==='INTRADAY'?`<span class="tag t-teal">日间批量汇总</span>`:`<span class="tag t-purple">日终批量汇总</span>`;
  document.getElementById('d-rule').textContent   = r.rule;
  document.getElementById('d-retry').innerHTML    = r.retry > 0
    ? `<span class="retry-badge" style="font-size:13px;">${r.retry} 次 / 最多 ${r.maxRetry} 次</span>`
    : `<span style="color:#52c41a;">0 次（未重试）</span>`;
  document.getElementById('d-acct').textContent   = r.acct;
  document.getElementById('d-subj').textContent   = r.subj;
  document.getElementById('d-dir').innerHTML      = r.dir==='DR'
    ? `<span class="dir-dr">借（DR）</span>` : `<span class="dir-cr">贷（CR）</span>`;
  document.getElementById('d-amt').innerHTML      = `<strong style="font-size:16px;color:${r.dir==='DR'?'#f5222d':'#1890ff'}">${fmt(r.amt)}</strong> 元`;
  document.getElementById('d-exp-date').textContent = r.expDate;
  document.getElementById('d-act-date').textContent = r.actDate || '—';
  document.getElementById('d-created').textContent  = r.created;
  document.getElementById('d-posted').textContent   = r.posted || '—';
  document.getElementById('d-bizno').textContent    = r.bizNo;
  document.getElementById('d-summary').textContent  = r.summary;

  const mf = document.getElementById('d-mf');
  mf.innerHTML = r.status==='FAIL'
    ? `<button class="btn btn-default" onclick="closeModal()">关闭</button><button class="btn btn-warn" onclick="retryOne(${r.id});closeModal()">🔁 手动重试</button>`
    : `<button class="btn btn-default" onclick="closeModal()">关闭</button>`;
  document.getElementById('detail-modal').classList.add('show');
}

function closeModal() { document.getElementById('detail-modal').classList.remove('show'); }
document.getElementById('detail-modal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });

function retryOne(id) {
  const r = rawData.find(x=>x.id===id); if(!r) return;
  r.status='PROCESSING'; r.retry++;
  updateStatCards(); applyFilters(); render();
  toast(`已提交重试：${r.no}`);
}

function retryFailed() {
  const fails = rawData.filter(r=>r.status==='FAIL');
  if (!fails.length) { toast('当前无失败记录'); return; }
  fails.forEach(r=>{ r.status='PROCESSING'; r.retry++; });
  updateStatCards(); applyFilters(); render();
  toast(`已提交 ${fails.length} 条失败记录重试`);
}

function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._t); t._t=setTimeout(()=>{t.style.opacity='0';},2500);
}

render();
</script>
</body>
</html>
