version: '3.8'

networks:
  accounting-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rmq_broker_store:
    driver: local
  backend_logs:
    driver: local

services:
  # ==============================================================================
  # 1. MySQL 数据库服务 (包含 accounting, nacos, xxl_job 库初始化)
  # ==============================================================================
  mysql:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: accounting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev@1234}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    networks:
      - accounting-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-dev@1234}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==============================================================================
  # 2. Redis 缓存与分布式锁服务
  # ==============================================================================
  redis:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: accounting-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - accounting-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev@1234}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # 3. Nacos 3.x 注册与配置中心 (Standalone 模式，集成 MySQL 持久化)
  # ==============================================================================
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v3.2.1}
    container_name: accounting-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev@1234}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      # Nacos 3.2.x 强制要求以下三个鉴权变量，即使关闭鉴权也必须提供，否则容器启动脚本 exit 255
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-QWNjb3VudGluZ05hY29zU2VjcmV0S2V5MjAyNkBrbHRi}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    networks:
      - accounting-net
    depends_on:
      mysql:
        condition: service_healthy

  # ==============================================================================
  # 4. RocketMQ 5.x 消息队列 - NameServer
  # ==============================================================================
  rocketmq-namesrv:
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.3.1}
    container_name: accounting-rmq-namesrv
    restart: unless-stopped
    user: root
    environment:
      JAVA_OPT_EXT: "-Xms512M -Xmx512M -Xmn256M"
      TZ: Asia/Shanghai
    command: ["sh", "mqnamesrv"]
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    networks:
      - accounting-net

  # ==============================================================================
  # 5. RocketMQ 5.x 消息队列 - Broker
  # ==============================================================================
  rocketmq-broker:
    image: apache/rocketmq:${ROCKETMQ_VERSION:-5.3.1}
    container_name: accounting-rmq-broker
    restart: unless-stopped
    user: root
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512M -Xmx512M -Xmn256M"
      TZ: Asia/Shanghai
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/broker.conf"]
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./rocketmq/conf/broker.conf:/home/rocketmq/broker.conf:ro
      - rmq_broker_store:/home/rocketmq/store
    networks:
      - accounting-net
    depends_on:
      - rocketmq-namesrv

  # ==============================================================================
  # 6. RocketMQ 控制台仪表板
  # ==============================================================================
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: accounting-rmq-dashboard
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8080"
      TZ: Asia/Shanghai
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-8088}:8080"
    networks:
      - accounting-net
    depends_on:
      - rocketmq-namesrv

  # ==============================================================================
  # 7. XXL-JOB 分布式任务调度中心
  # ==============================================================================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:${XXL_JOB_VERSION:-3.0.0}
    container_name: accounting-xxl-job
    restart: unless-stopped
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?Unicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-dev@1234}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-default_secret}
      TZ: Asia/Shanghai
    ports:
      - "${XXL_JOB_PORT:-8082}:8080"
    networks:
      - accounting-net
    depends_on:
      mysql:
        condition: service_healthy

  # ==============================================================================
  # 8. 后端账务核心引擎 (Spring Boot 3.3.5 + JDK 21 + Nacos 3.x 原生对接)
  # ==============================================================================
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: accounting-backend:latest
    container_name: accounting-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Nacos 3.x 注册中心与动态配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-dev}
      # MySQL 数据源
      DB_URL: jdbc:mysql://mysql:3306/accounting?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev@1234}
      # Redis 分布式缓存与 Redisson 4.x
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev@1234}
      # RocketMQ 5.x 异步消息
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      # XXL-Job 执行器自动注册
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-default_secret}
      XXL_JOB_EXECUTOR_APPNAME: accounting-core
      XXL_JOB_EXECUTOR_PORT: 9999
      # JVM 参数
      JAVA_OPTS: "-Xms512M -Xmx1024M -XX:+UseG1GC -Dfile.encoding=UTF-8"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${XXL_JOB_EXECUTOR_PORT:-9999}:9999"
    volumes:
      - backend_logs:/data/logs
    networks:
      - accounting-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      rocketmq-broker:
        condition: service_started
      xxl-job-admin:
        condition: service_started

  # ==============================================================================
  # 9. 前端管理控制台 (Vue 3 + Nginx 反向代理)
  # ==============================================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    image: accounting-frontend:latest
    container_name: accounting-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    networks:
      - accounting-net
    depends_on:
      - backend
