# RocketMQ 5.x Broker 核心配置
brokerClusterName = AccountingCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 自动创建 Topic 和消费组（开发/测试环境开启）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 基础端口
listenPort = 10911
