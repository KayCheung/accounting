# RocketMQ 5.x Broker 核心配置
brokerClusterName = AccountingCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 自动创建 Topic 和消费组（开发/测试环境开启）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 基础端口
listenPort = 10911

# 磁盘使用率水位调优（防止宿主机/开发测试机磁盘占用超 85% 时触发只读保护拒绝写入 CODE: 14）
diskMaxUsedSpaceRatio = 99
diskSpaceCleanForciblyRatio = 0.98
diskSpaceWarningLevelRatio = 0.99
