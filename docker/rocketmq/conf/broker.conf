# RocketMQ 5.x Broker 配置文件
brokerClusterName = AccountingCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 自动创建 Topic 和消费组（开发/测试环境开启）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# NameServer 地址（docker 内部网络服务名解析）
namesrvAddr = rocketmq-namesrv:9876

# 通信端口
listenPort = 10911

# store 路径（必须显式指定，否则容器内路径解析 NPE）
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
storePathConsumerQueue = /home/rocketmq/store/consumequeue
storePathIndex = /home/rocketmq/store/index
storeCheckpoint = /home/rocketmq/store/checkpoint
abortFile = /home/rocketmq/store/abort

# brokerIP1 留空，让 broker 自动获取容器内网 IP
# （写服务名字符串会导致 ScheduleMessageService.configFilePath NPE）
