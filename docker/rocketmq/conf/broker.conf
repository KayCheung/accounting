# RocketMQ 5.x Broker 配置文件
brokerClusterName = AccountingCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 自动创建 Topic 和消费组（开发/测试环境开启）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# NameServer 地址
namesrvAddr = rocketmq-namesrv:9876

# 通信端口
listenPort = 10911

# 容器内网络通信 IP（默认使用容器别名或由 Compose 环境变量覆盖）
brokerIP1 = rocketmq-broker
